name: Build and deploy Vision

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vision-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vision theme
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read canonical blog content
        uses: actions/checkout@v6
        with:
          repository: Jimmy1020119/Jimmy1020119.github.io
          ref: main
          path: _content-source
          persist-credentials: false

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Import shared posts and article assets
        run: bundle exec ruby tools/sync_content.rb _content-source

      - name: Build the project site
        run: bundle exec jekyll build --destination _site/vision
        env:
          JEKYLL_ENV: production

      - name: Validate project-site paths
        run: python3 tools/verify_site.py _site/vision

      - name: Validate generated HTML and internal links
        run: bundle exec htmlproofer _site --disable-external

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/vision

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
